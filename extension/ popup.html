<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 12px;
        color: #1a1a1a;
      }
      h2 {
        font-size: 13px;
        margin: 12px 0 6px;
        color: #555;
      }
      .row {
        margin-bottom: 4px;
      }
      .label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 2px;
      }
      .bar-track {
        height: 6px;
        background: #e5e5e5;
        border-radius: 3px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: #d97757;
        border-radius: 3px;
      }
      .reset {
        font-size: 11px;
        color: #888;
        margin-top: 2px;
      }
      .empty {
        font-size: 12px;
        color: #999;
      }
      .updated {
        font-size: 10px;
        color: #aaa;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="popup.js"></script>
  </body>
</html>
